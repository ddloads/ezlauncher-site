<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0c" />
    <title>EZlauncher — All Versions</title>
    <meta name="description" content="Download any version of EZlauncher for Windows." />
    <link rel="icon" type="image/png" href="/assets/ezlauncher-mark-256.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <nav class="top-nav">
        <div class="nav-brand">
          <img class="nav-logo" src="/assets/ezlauncher-mark-256.png" alt="" />
          <a class="nav-title" href="/">EZlauncher</a>
        </div>
        <a
          class="btn btn-ghost"
          href="https://github.com/ddloads/ezlauncher-site/releases"
          target="_blank"
          rel="noopener noreferrer"
        >GitHub</a>
      </nav>

      <main>
        <a class="back-link" href="/">&#8592; Back</a>

        <section class="panel">
          <div class="panel-head">
            <span class="kicker">Downloads</span>
            <h2>All versions</h2>
          </div>
          <div class="versions-list" id="versions-list">
            <p class="muted">Loading versions&hellip;</p>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <p>EZlauncher &copy; 2026</p>
        <div class="footer-links">
          <a href="https://github.com/ddloads/ezlauncher-site" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>
      </footer>
    </div>
    <script src="/versions.js" defer></script>
  </body>
</html>
